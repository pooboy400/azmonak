[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azmoonak-core"
version = "0.1.0"
description = "Azmoonak adaptive-learning algorithm core - pure Python, no I/O"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-dir]
core = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py310"
